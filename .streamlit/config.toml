# CARN-X  --  calm, white theme with a blue/cyan accent family (cosmetic only;
# no behaviour/logic touched). See theme.py for the full stylesheet.

# Serves ./static/* at <app-url>/app/static/* -- Streamlit's own built-in
# static file route, reading straight from this repo's checked-in files.
# No filesystem write at runtime, so unlike the old approach (copying icons
# into Streamlit's *installed package* static dir) this works on Streamlit
# Community Cloud. iOS's "Add to Home Screen" icon fetch also needs a real
# fetchable URL -- it does not reliably honour a data: URI -- which this
# gives it, where the earlier data-URI icons didn't.
[server]
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#2F6FED"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EAF2FF"
textColor = "#0B1220"
linkColor = "#1D4FBD"
borderColor = "#C9DBF5"
showWidgetBorder = true
baseRadius = "0.6rem"
baseFontSize = 15

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"

chartCategoricalColors = [
  "#2F6FED", "#1E8E3E", "#D68A1D", "#D33B2C",
  "#00AEEF", "#7B68F0", "#3D7FE0", "#D0499D",
]

[theme.sidebar]
backgroundColor = "#EAF2FF"
secondaryBackgroundColor = "#F5FAFF"
borderColor = "#C9DBF5"
