# CARN-X  --  "aurora glass" visual theme only (no behaviour / no logic touched).
# Near-black ground, one electric-violet accent, frosted glass; the live colour
# mesh + glass detailing live in theme.py.

[theme]
base = "dark"
primaryColor = "#8E7BF0"
backgroundColor = "#0A0A14"
secondaryBackgroundColor = "#12121F"
textColor = "#ECEDF6"
linkColor = "#BCA9FF"
borderColor = "#2A2A3E"
showWidgetBorder = true
baseRadius = "0.85rem"
baseFontSize = 15

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"

chartCategoricalColors = [
  "#8E7BF0", "#38E0F0", "#34D399", "#F472B6",
  "#A78BFA", "#818CF8", "#22D3EE", "#FB7185",
]

[theme.sidebar]
backgroundColor = "#080812"
secondaryBackgroundColor = "#12121F"
borderColor = "#22222F"
