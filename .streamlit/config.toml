# CARN-X  --  "light glass" visual theme only (no behaviour / no logic touched).
# Pale-grey ground, frosted white panels, one indigo accent, Bitcoin roundel at
# the orbital-nav hub.  Mesh + glass + orbit detailing live in theme.py.

[theme]
base = "light"
primaryColor = "#5B54E8"
backgroundColor = "#E3E5EC"
secondaryBackgroundColor = "#EEF0F6"
textColor = "#191B29"
linkColor = "#4A43C8"
borderColor = "#D3D5E4"
showWidgetBorder = true
baseRadius = "0.85rem"
baseFontSize = 15

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"

chartCategoricalColors = [
  "#5B54E8", "#0BA5C4", "#0E9F6E", "#D6409F",
  "#7C6BF0", "#6366F1", "#0891B2", "#E5484D",
]

[theme.sidebar]
backgroundColor = "#F1F2F8"
secondaryBackgroundColor = "#F7F8FC"
borderColor = "#DCDEEA"
