# CARN-X  --  "liquid glass" visual theme only (no behaviour / no logic touched).
# Deep electric ground, near-clear glass, bright specular rims.  The mesh, the
# glass recipe and the orbital nav live in theme.py.

[theme]
base = "dark"
primaryColor = "#9B8CFF"
backgroundColor = "#0E1216"
secondaryBackgroundColor = "#141A1F"
textColor = "#F2F1FA"
linkColor = "#C9BEFF"
borderColor = "#2A2A2E"
showWidgetBorder = true
baseRadius = "0.9rem"
baseFontSize = 15

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "'Playfair Display':https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"

chartCategoricalColors = [
  "#9B8CFF", "#4DE3F0", "#3DDC97", "#FF6EC7",
  "#B08CFF", "#6C8CFF", "#37D6E8", "#FF6B7A",
]

[theme.sidebar]
backgroundColor = "#0B0B0C"
secondaryBackgroundColor = "#161617"
borderColor = "#242426"
