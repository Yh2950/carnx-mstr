# CARN-X  --  visual theme only (no behaviour / no logic touched)
# Deep-navy instrument plate, one antique-gold accent.

[theme]
base = "dark"
primaryColor = "#C6A052"                 # antique gold -- widgets / accents
backgroundColor = "#080C17"              # the plate
secondaryBackgroundColor = "#0C1322"     # raised panels
textColor = "#DBE1EF"
linkColor = "#E7CD8C"
font = "sans-serif"
headingFont = "serif"
codeFont = "monospace"
baseRadius = "0.6rem"
borderColor = "#1B2740"
showWidgetBorder = true
baseFontSize = 15

# native st.line_chart / st.bar_chart / st.area_chart pick these up
chartCategoricalColors = [
  "#C6A052", "#7FB4D6", "#57B98A", "#C98BA6",
  "#8C86C9", "#B9924A", "#6E7DA8", "#D9694F",
]
# this Streamlit build wants exactly 10 sequential stops (navy -> gold)
chartSequentialColors = [
  "#0B1222", "#152238", "#213453", "#33406E", "#4A4C7F",
  "#6B5C7C", "#8F6E6A", "#AC8654", "#C6A052", "#E7CD8C",
]

[theme.sidebar]
backgroundColor = "#05080F"
secondaryBackgroundColor = "#0C1322"
borderColor = "#1B2740"
