# CARN-X  --  calm, normal theme (cosmetic only; no behaviour/logic touched).
# One flat near-black ground, one quiet blue accent, plain sans typography.
# See theme.py for the full stylesheet.

[theme]
base = "dark"
primaryColor = "#4C8DFF"
backgroundColor = "#0B0F14"
secondaryBackgroundColor = "#12161C"
textColor = "#E7EAEE"
linkColor = "#9CC2FF"
borderColor = "#242A31"
showWidgetBorder = true
baseRadius = "0.6rem"
baseFontSize = 15

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"

chartCategoricalColors = [
  "#4C8DFF", "#3FB950", "#E2A23D", "#F85149",
  "#58C6FF", "#9C8CFF", "#6C8CFF", "#E888C4",
]

[theme.sidebar]
backgroundColor = "#070A0D"
secondaryBackgroundColor = "#12161C"
borderColor = "#242A31"
